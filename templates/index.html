<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Agent - 智能問答助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(90deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #e9ecef;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
        }

        .message.assistant {
            flex-direction: column;
            align-items: flex-start;
        }

        .show-logs-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 8px;
            margin-left: 0;
        }

        .show-logs-btn:hover {
            background: #545b62;
        }

        .logs-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .logs-modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .logs-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
        }

        .logs-modal-title {
            margin: 0;
            color: #333;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .close-modal:hover {
            color: #000;
        }

        .log-entry {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .log-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-type {
            background: #007bff;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .log-type.SEARCH { background: #28a745; }
        .log-type.CHAT { background: #007bff; }
        .log-type.ANSWER { background: #ffc107; color: #000; }
        .log-type.RESPONSE { background: #6f42c1; }
        .log-type.SUMMARY { background: #20c997; }
        .log-type.ERROR { background: #dc3545; }
        .log-type.SYSTEM { background: #6c757d; }
        .log-type.QUERY_EXPANSION { background: #17a2b8; }
        .log-type.KEYWORD_SEARCH { background: #fd7e14; }

        .log-timestamp {
            font-size: 11px;
            color: #666;
        }

        .log-operation {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .log-details {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #007bff;
        }

        .send-button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }

        .control-btn:hover {
            background: #545b62;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-selector label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .model-select {
            padding: 6px 12px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
            min-width: 200px;
        }

        .model-select:focus {
            outline: none;
            border-color: #007bff;
        }

        .model-select optgroup {
            font-weight: bold;
            color: #666;
            padding: 4px 0;
        }

        .model-select option {
            font-weight: normal;
            color: #333;
            padding: 2px 4px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-style: italic;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-style: italic;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 16px;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                border-radius: 15px;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .chat-input-form {
                flex-direction: column;
            }
            
            .send-button {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 RAG Agent</h1>
            <p>智能問答助手 - 基於知識庫的對話系統</p>
        </div>
        
        <div class="status-bar" id="statusBar">
            <span id="statusText">正在載入系統狀態...</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h3>👋 歡迎使用 RAG Agent！</h3>
                <p>我是您的智能助手，可以根據知識庫為您提供準確的答案。</p>
                <p>您可以開始提問，或使用以下指令：</p>
                <ul style="text-align: left; margin-top: 10px;">
                    <li><strong>clear_history</strong> - 清除對話歷史</li>
                    <li><strong>show_history</strong> - 顯示對話歷史</li>
                </ul>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="control-buttons">
                <button class="control-btn" onclick="clearHistory()">清除歷史</button>
                <button class="control-btn" onclick="showHistory()">顯示歷史</button>
                <button class="control-btn" onclick="refreshStatus()">刷新狀態</button>
                
                <div class="model-selector">
                    <label for="modelSelect">模型:</label>
                    <select id="modelSelect" class="model-select" onchange="changeModel()">
                        <option value="">載入中...</option>
                    </select>
                </div>
            </div>
            
            <form class="chat-input-form" id="chatForm">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="請輸入您的問題..."
                    autocomplete="off"
                >
                <button type="submit" class="send-button" id="sendButton">
                    發送
                </button>
            </form>
        </div>
    </div>

    <!-- Logs Modal -->
    <div id="logsModal" class="logs-modal">
        <div class="logs-modal-content">
            <div class="logs-modal-header">
                <h3 class="logs-modal-title">問題處理日誌</h3>
                <button class="close-modal" onclick="closeLogsModal()">&times;</button>
            </div>
            <div id="logsContent">
                <!-- Logs content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatForm = document.getElementById('chatForm');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');

        // State
        let isLoading = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            messageInput.focus();
            loadAvailableModels();
            refreshStatus();
        });

        // Event listeners
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Functions
        async function loadAvailableModels() {
            try {
                const response = await fetch('/models');
                const data = await response.json();

                if (response.ok) {
                    const modelSelect = document.getElementById('modelSelect');
                    modelSelect.innerHTML = ''; // Clear loading option

                    // Group models by provider
                    const modelsByProvider = {};
                    Object.entries(data.available_models).forEach(([modelId, modelInfo]) => {
                        if (!modelsByProvider[modelInfo.provider]) {
                            modelsByProvider[modelInfo.provider] = [];
                        }
                        modelsByProvider[modelInfo.provider].push({
                            id: modelId,
                            ...modelInfo
                        });
                    });

                    // Add options grouped by provider
                    Object.entries(modelsByProvider).forEach(([provider, models]) => {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = provider;
                        
                        models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model.id;
                            option.textContent = `${model.display_name} - ${model.description}`;
                            
                            // Mark current model as selected
                            if (model.id === data.current_model) {
                                option.selected = true;
                            }
                            
                            optgroup.appendChild(option);
                        });
                        
                        modelSelect.appendChild(optgroup);
                    });

                    console.log('Available models loaded successfully');
                } else {
                    console.error('Failed to load available models:', data.error);
                    // Fallback to basic options
                    const modelSelect = document.getElementById('modelSelect');
                    modelSelect.innerHTML = `
                        <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
                        <option value="openai/gpt-4o">GPT-4o</option>
                        <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    `;
                }
            } catch (error) {
                console.error('Error loading available models:', error);
                // Fallback to basic options
                const modelSelect = document.getElementById('modelSelect');
                modelSelect.innerHTML = `
                    <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>
                    <option value="openai/gpt-4o">GPT-4o</option>
                    <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                `;
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            // Add user message to chat
            addMessage('user', message);
            messageInput.value = '';
            setLoadingState(true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage('assistant', data.response, data.timestamp, data.question_id);
                } else {
                    addErrorMessage(data.error || '發生未知錯誤');
                }
            } catch (error) {
                console.error('Error:', error);
                addErrorMessage('網路連接錯誤，請稍後再試');
            } finally {
                setLoadingState(false);
            }
        }

        function addMessage(sender, content, timestamp = null, questionId = null) {
            // Remove welcome message if exists
            const welcomeMessage = chatMessages.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            if (timestamp) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = timestamp;
                contentDiv.appendChild(timeDiv);
            }

            messageDiv.appendChild(contentDiv);

            // Add show logs button for assistant messages with questionId
            if (sender === 'assistant' && questionId) {
                const showLogsBtn = document.createElement('button');
                showLogsBtn.className = 'show-logs-btn';
                showLogsBtn.textContent = '📋 顯示處理日誌';
                showLogsBtn.onclick = () => showLogs(questionId);
                messageDiv.appendChild(showLogsBtn);
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addErrorMessage(error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `錯誤: ${error}`;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function setLoadingState(loading) {
            isLoading = loading;
            sendButton.disabled = loading;
            
            if (loading) {
                sendButton.textContent = '處理中...';
                // Add loading message
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message assistant loading-message';
                loadingDiv.innerHTML = '<div class="message-content loading">正在思考<span class="loading-dots"></span></div>';
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                sendButton.textContent = '發送';
                // Remove loading message
                const loadingMessage = chatMessages.querySelector('.loading-message');
                if (loadingMessage) {
                    loadingMessage.remove();
                }
                messageInput.focus();
            }
        }

        async function clearHistory() {
            try {
                const response = await fetch('/clear_history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Clear chat messages and show welcome message
                    chatMessages.innerHTML = `
                        <div class="welcome-message">
                            <h3>🔄 對話歷史已清除</h3>
                            <p>您可以開始新的對話了！</p>
                        </div>
                    `;
                } else {
                    addErrorMessage(data.error || '清除歷史失敗');
                }
            } catch (error) {
                console.error('Error:', error);
                addErrorMessage('網路連接錯誤');
            }
        }

        function showHistory() {
            messageInput.value = 'show_history';
            sendMessage();
        }

        async function refreshStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                if (response.ok) {
                    statusText.textContent = `狀態: ${data.rag_agent_initialized ? '已初始化' : '未初始化'} | 模型: ${data.model_name || 'N/A'} | 文檔數量: ${data.documents_loaded} | 對話記錄: ${data.conversation_history_length}`;
                    
                    // Update model selector to reflect current model
                    const modelSelect = document.getElementById('modelSelect');
                    if (data.model_name && modelSelect) {
                        modelSelect.value = data.model_name;
                    }
                } else {
                    statusText.textContent = `狀態錯誤: ${data.error}`;
                }
            } catch (error) {
                statusText.textContent = '無法獲取狀態資訊';
            }
        }

        async function changeModel() {
            const modelSelect = document.getElementById('modelSelect');
            const selectedModel = modelSelect.value;

            try {
                statusText.textContent = '正在切換模型...';
                
                const response = await fetch('/change_model', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ model_name: selectedModel })
                });

                const data = await response.json();

                if (response.ok) {
                    statusText.textContent = `模型已切換至: ${selectedModel}`;
                    // Add a message to the chat
                    addMessage('assistant', `🔄 模型已切換至: ${getModelDisplayName(selectedModel)}`);
                    // Refresh status to update display
                    setTimeout(refreshStatus, 1000);
                } else {
                    statusText.textContent = `切換模型失敗: ${data.error}`;
                    addErrorMessage(data.error || '切換模型失敗');
                }
            } catch (error) {
                console.error('Error:', error);
                statusText.textContent = '切換模型時發生網路錯誤';
                addErrorMessage('網路連接錯誤');
            }
        }

        function getModelDisplayName(modelName) {
            // Try to get display name from the model selector options
            const modelSelect = document.getElementById('modelSelect');
            const option = modelSelect.querySelector(`option[value="${modelName}"]`);
            if (option) {
                return option.textContent.split(' - ')[0]; // Get just the model name part before description
            }
            
            // Fallback to manual mapping for common models
            const fallbackNames = {
                'anthropic/claude-3.5-haiku': 'Claude 3.5 Haiku',
                'anthropic/claude-3.5-sonnet': 'Claude 3.5 Sonnet',
                'openai/gpt-4o': 'GPT-4o',
                'openai/gpt-4o-mini': 'GPT-4o Mini',
                'openai/gpt-4-turbo': 'GPT-4 Turbo',
                'openai/gpt-3.5-turbo': 'GPT-3.5 Turbo',
                'google/gemini-pro': 'Gemini Pro',
                'meta-llama/llama-3.1-70b-instruct': 'Llama 3.1 70B',
                'meta-llama/llama-3.1-8b-instruct': 'Llama 3.1 8B',
                'mistralai/mistral-7b-instruct': 'Mistral 7B Instruct'
            };
            return fallbackNames[modelName] || modelName;
        }

        async function showLogs(questionId) {
            try {
                const response = await fetch(`/logs/${questionId}`);
                const data = await response.json();

                if (response.ok) {
                    displayLogsModal(data);
                } else {
                    alert(`無法載入日誌: ${data.error}`);
                }
            } catch (error) {
                console.error('Error fetching logs:', error);
                alert('載入日誌時發生錯誤');
            }
        }

        function displayLogsModal(logData) {
            const logsContent = document.getElementById('logsContent');
            
            // Use total token usage from session data if available, otherwise calculate from logs
            let totalTokenUsage = logData.total_token_usage || {
                prompt_tokens: 0,
                completion_tokens: 0,
                total_tokens: 0
            };
            
            // If no session token data, calculate from logs
            if (!logData.total_token_usage && logData.logs && logData.logs.length > 0) {
                logData.logs.forEach(log => {
                    if (log.details && log.details.token_usage) {
                        totalTokenUsage.prompt_tokens += log.details.token_usage.prompt_tokens || 0;
                        totalTokenUsage.completion_tokens += log.details.token_usage.completion_tokens || 0;
                        totalTokenUsage.total_tokens += log.details.token_usage.total_tokens || 0;
                    }
                });
            }
            
            // Create header info
            const headerInfo = document.createElement('div');
            headerInfo.style.marginBottom = '20px';
            headerInfo.style.padding = '15px';
            headerInfo.style.backgroundColor = '#e9ecef';
            headerInfo.style.borderRadius = '8px';
            
            let headerHtml = `
                <div style="margin-bottom: 8px;"><strong>問題:</strong> ${logData.question}</div>
                <div style="margin-bottom: 8px;"><strong>時間:</strong> ${logData.timestamp}</div>
                <div style="margin-bottom: 8px;"><strong>處理時間:</strong> ${logData.processing_time ? logData.processing_time.toFixed(2) + ' 秒' : 'N/A'}</div>
                <div style="margin-bottom: 8px;"><strong>回應預覽:</strong> ${logData.response.substring(0, 150)}${logData.response.length > 150 ? '...' : ''}</div>
            `;
            
            // Add total token usage if any tokens were used
            if (totalTokenUsage.total_tokens > 0) {
                headerHtml += `
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #ced4da;">
                    <strong>🔢 總 Token 使用量:</strong><br>
                    <span style="margin-left: 10px;">📥 輸入: ${totalTokenUsage.prompt_tokens} tokens</span><br>
                    <span style="margin-left: 10px;">📤 輸出: ${totalTokenUsage.completion_tokens} tokens</span><br>
                    <span style="margin-left: 10px;">🔄 總計: ${totalTokenUsage.total_tokens} tokens</span>
                </div>
                `;
            }
            
            headerInfo.innerHTML = headerHtml;
            
            logsContent.innerHTML = '';
            logsContent.appendChild(headerInfo);

            // Create logs entries
            if (logData.logs && logData.logs.length > 0) {
                const processTitle = document.createElement('h4');
                processTitle.textContent = '處理流程日誌:';
                processTitle.style.margin = '20px 0 15px 0';
                processTitle.style.color = '#333';
                logsContent.appendChild(processTitle);

                logData.logs.forEach((log, index) => {
                    const logDiv = document.createElement('div');
                    logDiv.className = 'log-entry';
                    
                    // Format details better
                    let detailsStr = '';
                    if (log.details && typeof log.details === 'object') {
                        // Show key information in a more readable format
                        if (log.type === 'CHAT' || log.type === 'ANSWER') {
                            detailsStr = `查詢: ${log.details.query || 'N/A'}\n`;
                            if (log.details.documents_used) {
                                detailsStr += `使用文檔數量: ${log.details.documents_used}\n`;
                            }
                            if (log.details.top_similarity) {
                                detailsStr += `最高相似度: ${(log.details.top_similarity * 100).toFixed(2)}%\n`;
                            }
                            if (log.details.conversation_history_length !== undefined) {
                                detailsStr += `對話歷史長度: ${log.details.conversation_history_length}\n`;
                            }
                        } else if (log.type === 'SEARCH') {
                            if (log.details.query) {
                                detailsStr += `🔍 搜尋查詢: ${log.details.query}\n`;
                            }
                            if (log.details.expanded_query && log.details.expanded_query !== log.details.query) {
                                detailsStr += `🔄 擴展查詢: ${log.details.expanded_query}\n`;
                            }
                            if (log.details.search_type) {
                                detailsStr += `📋 搜尋類型: ${log.details.search_type}\n`;
                            }
                            if (log.details.top_k) {
                                detailsStr += `📊 請求數量: ${log.details.top_k}\n`;
                            }
                            if (log.details.total_documents) {
                                detailsStr += `📚 總文檔數: ${log.details.total_documents}\n`;
                            }
                            if (log.details.keyword_matches !== undefined) {
                                detailsStr += `🔑 關鍵字匹配: ${log.details.keyword_matches}\n`;
                            }
                            if (log.details.max_semantic_score) {
                                detailsStr += `⚡ 最高語義分數: ${(log.details.max_semantic_score * 100).toFixed(2)}%\n`;
                            }
                            
                            // Show search results
                            if (log.details.results && log.details.results.length > 0) {
                                detailsStr += `\n📋 搜尋結果 (${log.details.results.length} 筆):\n`;
                                detailsStr += '='.repeat(50) + '\n';
                                
                                log.details.results.forEach((result, idx) => {
                                    detailsStr += `\n${idx + 1}. 相似度: ${(result.similarity_score * 100).toFixed(2)}%\n`;
                                    detailsStr += `   問題: ${result.question}\n`;
                                    detailsStr += `   答案: ${result.answer.length > 100 ? result.answer.substring(0, 100) + '...' : result.answer}\n`;
                                    detailsStr += `   來源: ${result.source}\n`;
                                    if (idx < log.details.results.length - 1) {
                                        detailsStr += '-'.repeat(30) + '\n';
                                    }
                                });
                            }
                        } else if (log.type === 'KEYWORD_SEARCH') {
                            if (log.details.query) {
                                detailsStr += `🔍 關鍵字搜尋: ${log.details.query}\n`;
                            }
                            if (log.details.extracted_keywords) {
                                detailsStr += `🏷️ 提取關鍵字: [${log.details.extracted_keywords.join(', ')}]\n`;
                            }
                            if (log.details.matches_found !== undefined) {
                                detailsStr += `📊 找到匹配: ${log.details.matches_found} 筆\n`;
                            }
                            if (log.details.top_scores) {
                                detailsStr += `⭐ 前三分數: [${log.details.top_scores.map(s => s.toFixed(2)).join(', ')}]\n`;
                            }
                            
                            // Show keyword search results
                            if (log.details.results && log.details.results.length > 0) {
                                detailsStr += `\n📋 關鍵字搜尋結果 (${log.details.results.length} 筆):\n`;
                                detailsStr += '='.repeat(50) + '\n';
                                
                                log.details.results.forEach((result, idx) => {
                                    detailsStr += `\n${idx + 1}. 關鍵字分數: ${result.keyword_score.toFixed(2)}\n`;
                                    detailsStr += `   匹配關鍵字: [${result.matched_keywords.join(', ')}]\n`;
                                    detailsStr += `   問題: ${result.question}\n`;
                                    detailsStr += `   答案: ${result.answer}\n`;
                                    detailsStr += `   來源: ${result.source}\n`;
                                    if (idx < log.details.results.length - 1) {
                                        detailsStr += '-'.repeat(30) + '\n';
                                    }
                                });
                            }
                        } else if (log.type === 'QUERY_EXPANSION') {
                            if (log.details.original_query) {
                                detailsStr += `🔍 原始查詢: ${log.details.original_query}\n`;
                            }
                            if (log.details.expanded_terms) {
                                detailsStr += `🔄 擴展詞彙: [${log.details.expanded_terms.join(', ')}]\n`;
                            }
                            if (log.details.expansion_type) {
                                detailsStr += `📝 擴展類型: ${log.details.expansion_type}\n`;
                            }
                            if (log.details.final_query) {
                                detailsStr += `✅ 最終查詢: ${log.details.final_query}\n`;
                            }
                        } else if (log.type === 'RESPONSE' || log.type === 'SUMMARY') {
                            if (log.details.query) {
                                detailsStr += `🔍 查詢: ${log.details.query}\n`;
                            }
                            if (log.details.model) {
                                detailsStr += `🤖 模型: ${log.details.model}\n`;
                            }
                            if (log.details.response_length) {
                                detailsStr += `📝 回應長度: ${log.details.response_length} 字符\n`;
                            }
                            if (log.details.context_docs_count !== undefined) {
                                detailsStr += `📚 使用文檔: ${log.details.context_docs_count} 個\n`;
                            }
                            if (log.details.conversation_history_length !== undefined) {
                                detailsStr += `💬 對話歷史: ${log.details.conversation_history_length} 輪\n`;
                            }
                            // Display token usage information
                            if (log.details.token_usage) {
                                detailsStr += `\n🔢 Token 使用統計:\n`;
                                detailsStr += `   📥 輸入 Tokens: ${log.details.token_usage.prompt_tokens || 0}\n`;
                                detailsStr += `   📤 輸出 Tokens: ${log.details.token_usage.completion_tokens || 0}\n`;
                                detailsStr += `   🔄 總計 Tokens: ${log.details.token_usage.total_tokens || 0}\n`;
                            }
                        } else {
                            detailsStr = JSON.stringify(log.details, null, 2);
                        }
                    } else {
                        detailsStr = log.details ? String(log.details) : '無詳細資訊';
                    }
                    
                    logDiv.innerHTML = `
                        <div class="log-entry-header">
                            <span class="log-type ${log.type}">${log.type}</span>
                            <span class="log-timestamp">${log.timestamp}</span>
                        </div>
                        <div class="log-operation">${index + 1}. ${log.operation}</div>
                        <div class="log-details">${detailsStr}</div>
                    `;
                    
                    logsContent.appendChild(logDiv);
                });
            } else {
                const noLogsDiv = document.createElement('div');
                noLogsDiv.style.textAlign = 'center';
                noLogsDiv.style.color = '#666';
                noLogsDiv.style.padding = '20px';
                noLogsDiv.innerHTML = `
                    <div style="font-size: 16px; margin-bottom: 10px;">📋</div>
                    <div>此問題沒有詳細的處理流程日誌</div>
                    <div style="font-size: 12px; margin-top: 5px; color: #999;">可能是系統指令或日誌記錄失敗</div>
                `;
                logsContent.appendChild(noLogsDiv);
            }

            // Show modal
            document.getElementById('logsModal').style.display = 'block';
        }

        function closeLogsModal() {
            document.getElementById('logsModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('logsModal');
            if (event.target === modal) {
                closeLogsModal();
            }
        }

        // Auto-refresh status every 30 seconds
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
