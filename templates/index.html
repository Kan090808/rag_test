<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Agent - 智能問答助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(90deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #e9ecef;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #007bff;
        }

        .send-button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-btn {
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }

        .control-btn:hover {
            background: #545b62;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-style: italic;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-style: italic;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 16px;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                border-radius: 15px;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .chat-input-form {
                flex-direction: column;
            }
            
            .send-button {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 RAG Agent</h1>
            <p>智能問答助手 - 基於知識庫的對話系統</p>
        </div>
        
        <div class="status-bar" id="statusBar">
            <span id="statusText">正在載入系統狀態...</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h3>👋 歡迎使用 RAG Agent！</h3>
                <p>我是您的智能助手，可以根據知識庫為您提供準確的答案。</p>
                <p>您可以開始提問，或使用以下指令：</p>
                <ul style="text-align: left; margin-top: 10px;">
                    <li><strong>clear_history</strong> - 清除對話歷史</li>
                    <li><strong>show_history</strong> - 顯示對話歷史</li>
                </ul>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="control-buttons">
                <button class="control-btn" onclick="clearHistory()">清除歷史</button>
                <button class="control-btn" onclick="showHistory()">顯示歷史</button>
                <button class="control-btn" onclick="refreshStatus()">刷新狀態</button>
            </div>
            
            <form class="chat-input-form" id="chatForm">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="請輸入您的問題..."
                    autocomplete="off"
                >
                <button type="submit" class="send-button" id="sendButton">
                    發送
                </button>
            </form>
        </div>
    </div>

    <script>
        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatForm = document.getElementById('chatForm');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');

        // State
        let isLoading = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            messageInput.focus();
            refreshStatus();
        });

        // Event listeners
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Functions
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            // Add user message to chat
            addMessage('user', message);
            messageInput.value = '';
            setLoadingState(true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage('assistant', data.response, data.timestamp);
                } else {
                    addErrorMessage(data.error || '發生未知錯誤');
                }
            } catch (error) {
                console.error('Error:', error);
                addErrorMessage('網路連接錯誤，請稍後再試');
            } finally {
                setLoadingState(false);
            }
        }

        function addMessage(sender, content, timestamp = null) {
            // Remove welcome message if exists
            const welcomeMessage = chatMessages.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            if (timestamp) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = timestamp;
                contentDiv.appendChild(timeDiv);
            }

            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addErrorMessage(error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `錯誤: ${error}`;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function setLoadingState(loading) {
            isLoading = loading;
            sendButton.disabled = loading;
            
            if (loading) {
                sendButton.textContent = '處理中...';
                // Add loading message
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message assistant loading-message';
                loadingDiv.innerHTML = '<div class="message-content loading">正在思考<span class="loading-dots"></span></div>';
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                sendButton.textContent = '發送';
                // Remove loading message
                const loadingMessage = chatMessages.querySelector('.loading-message');
                if (loadingMessage) {
                    loadingMessage.remove();
                }
                messageInput.focus();
            }
        }

        async function clearHistory() {
            try {
                const response = await fetch('/clear_history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Clear chat messages and show welcome message
                    chatMessages.innerHTML = `
                        <div class="welcome-message">
                            <h3>🔄 對話歷史已清除</h3>
                            <p>您可以開始新的對話了！</p>
                        </div>
                    `;
                } else {
                    addErrorMessage(data.error || '清除歷史失敗');
                }
            } catch (error) {
                console.error('Error:', error);
                addErrorMessage('網路連接錯誤');
            }
        }

        function showHistory() {
            messageInput.value = 'show_history';
            sendMessage();
        }

        async function refreshStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                if (response.ok) {
                    statusText.textContent = `狀態: ${data.rag_agent_initialized ? '已初始化' : '未初始化'} | 模型: ${data.model_name || 'N/A'} | 文檔數量: ${data.documents_loaded} | 對話記錄: ${data.conversation_history_length}`;
                } else {
                    statusText.textContent = `狀態錯誤: ${data.error}`;
                }
            } catch (error) {
                statusText.textContent = '無法獲取狀態資訊';
            }
        }

        // Auto-refresh status every 30 seconds
        setInterval(refreshStatus, 30000);
    </script>
</body>
</html>
